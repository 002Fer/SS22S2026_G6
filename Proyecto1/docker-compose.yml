services:
  source_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgfood_source
      POSTGRES_USER: sgfood
      POSTGRES_PASSWORD: sgfood_source_2026
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - source_postgres_data:/var/lib/postgresql/data
      - ./data/oltp/sgfood_oltp.sql:/docker-entrypoint-initdb.d/001_sgfood_oltp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood -d sgfood_source"]
      interval: 5s
      timeout: 5s
      retries: 20

  warehouse_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sgfood_dw
      POSTGRES_USER: sgfood
      POSTGRES_PASSWORD: sgfood_dw_2026
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
      - ./sql/create_schemas.sql:/docker-entrypoint-initdb.d/001_create_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgfood -d sgfood_dw"]
      interval: 5s
      timeout: 5s
      retries: 20

  python_loader:
    build:
      context: .
    depends_on:
      source_db:
        condition: service_healthy
      warehouse_db:
        condition: service_healthy
    environment:
      SOURCE_DB_HOST: source_db
      SOURCE_DB_PORT: 5432
      SOURCE_DB_NAME: sgfood_source
      SOURCE_DB_USER: sgfood
      SOURCE_DB_PASSWORD: sgfood_source_2026
      TARGET_DB_HOST: warehouse_db
      TARGET_DB_PORT: 5432
      TARGET_DB_NAME: sgfood_dw
      TARGET_DB_USER: sgfood
      TARGET_DB_PASSWORD: sgfood_dw_2026
      CSV_DIR: /app/data/csv
      RAW_DDL_PATH: /app/sql/create_raw.sql
      DB_CONNECT_ATTEMPTS: 20
      DB_CONNECT_DELAY_SECONDS: 2
      EXTRACT_BATCH_SIZE: 1000
      LOG_LEVEL: INFO
      LOG_FILE: /app/logs/python_raw_load.log
    volumes:
      - ./logs:/app/logs
    command: ["run-all"]
    restart: "no"

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.9
    depends_on:
      warehouse_db:
        condition: service_healthy
      python_loader:
        condition: service_completed_successfully
    environment:
      DBT_HOST: warehouse_db
      DBT_PORT: 5432
      DBT_USER: sgfood
      DBT_PASSWORD: sgfood_dw_2026
      DBT_DBNAME: sgfood_dw
    volumes:
      - ./dbt/sgfood_dbt:/usr/app
    working_dir: /usr/app
    command: ["run", "--profiles-dir", "."]

  airflow:
    image: apache/airflow:2.8.1-python3.11
    depends_on:
      warehouse_db:
        condition: service_healthy
      source_db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=sgfood_secret_key_2026
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - SOURCE_DB_HOST=source_db
      - SOURCE_DB_PORT=5432
      - SOURCE_DB_NAME=sgfood_source
      - SOURCE_DB_USER=sgfood
      - SOURCE_DB_PASSWORD=sgfood_source_2026
      - TARGET_DB_HOST=warehouse_db
      - TARGET_DB_PORT=5432
      - TARGET_DB_NAME=sgfood_dw
      - TARGET_DB_USER=sgfood
      - TARGET_DB_PASSWORD=sgfood_dw_2026
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs/airflow:/opt/airflow/logs
      - .:/opt/airflow/project
    command: standalone

volumes:
  source_postgres_data:
  warehouse_postgres_data:
