name: practica1-vuelos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Practica1_G6_2026!}"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}"
          -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SQLSERVER_SERVER: sqlserver,1433
      SQLSERVER_DATABASE: VuelosDW
      SQLSERVER_DRIVER: ODBC Driver 18 for SQL Server
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: "${MSSQL_SA_PASSWORD:-Practica1_G6_2026!}"
      SQLSERVER_ENCRYPT: "yes"
      SQLSERVER_TRUST_CERT: "yes"
      SQLSERVER_TIMEOUT: "60"
    depends_on:
      sqlserver:
        condition: service_healthy
    command: ["python", "src/main.py", "--crear-esquema"]
    restart: "no"

volumes:
  sqlserver_data:
    name: practica1_vuelos_sqlserver_data
